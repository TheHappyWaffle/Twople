<!DOCTYPE html>

<html> <!-- Start the file -->
    <head> 
        <title>Word Ladder</title> <!-- This is the title of the web bage -->
        <link rel="stylesheet" href="style.css"> <!-- link the CSS file to the HTML file -->
    </head>

    <body> <!-- This is what's in the web page -->
        <h1 id="Title">Word Ladder</h1> <!-- This is a header with the id Title -->

        <p>This is my word ladder game.</p> <!-- This is a paragraph -->

        <button id="testButton" class="word">Hee hee</button> <!-- This is a button refered to as testButton in code, and it displayes the text "hee hee" -->
        <script src="game.js"></script> <!-- src means source file, and it only recognizes game.js b/c theyre in the same folder, otherwise you'd need to specify the file path -->

        <div class="wordContainer">
            <div class="word">COLD</div> <!-- This is a generic container of class type 'word' that contains the text "cold"-->
            <div class="word">CORD</div>
            <div class="word">CARD</div>
    </body>

    
</html> <!-- End the file -->
