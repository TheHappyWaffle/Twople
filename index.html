<!DOCTYPE html>
<html>
    <head>
        <title>Twople</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="menu hidden" id="menu-container">
            <h1>!!!YOU WIN!!!</h1>
            <p id="shortest-path"></p>
            <p id="moves-required"></p>
            <div class="input-row">
                <button id="newgame-button" class="newgame-button">New Game</button>
            </div>
        </div>

        <div class="menu" id="start-menu">
            <h1>Twople</h1>

            <div class="difficulty-options">
                <div class="difficulty-row">
                    <button id="easy-button" class="easy">EASY</button>
                    <span>4 - 6 words</span>
                </div>

                <div class="difficulty-row">
                    <button id="medium-button" class="medium">MEDIUM</button>
                    <span>7 - 9 words</span>
                </div>

                <div class="difficulty-row">
                    <button id="hard-button" class="hard">HARD</button>
                    <span>10 - 14 words</span>
                </div>

                <div class="difficulty-row">
                    <button id="hardest-button" class="hardest">VERY HARD</button>
                    <span>17 - 18 words</span>
                </div>
            </div>
        </div>

        <div class="game hidden" id="game-container">
            <h1>Twople</h1>

            <div class="word-container" id="word-container">
            </div>

            <p id="error-text"></p>
            <div class="input-row">
                <input id="word-input" class="submission-box" type="text" maxlength="4" pattern="[A-Za-z]*">
                <button id="submit-button" class="submit-button">Submit</button>
            </div>

            <p id="target-word">Target Word:</p>
            <div class="input-row">
                <button id="restart-button" class="restart-button">Restart</button>
                <button id="giveup-button" class="giveup-button">Give Up</button>
            </div>
        </div>
    </body>

    <script src="game.js"></script>
</html>
