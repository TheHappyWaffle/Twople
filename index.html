<!DOCTYPE html>

<html> <!-- Start the file -->
    <head> 
        <title>Word Ladder</title> <!-- This is the title of the web bage -->
        <link rel="stylesheet" href="style.css"> <!-- link the CSS file to the HTML file -->
        
    </head>

    <body> <!-- This is what's in the web page -->

        <div class="game">
            <h1>Poople 2</h1> <!-- This is a header of class Title -->
            <div class="word-container" id="word-container">
                <div class="word">
                    <div class="letter">C</div>
                    <div class="letter">O</div>
                    <div class="letter">L</div>
                    <div class="letter">D</div>
                </div> 
            </div>

            <input id="word-input" type="text" maxlength="4" pattern="[A-Za-z]*">
            <button id="submit-button">Submit</button>

            <p id = "target-word">Target Word: </p>
        </div>  
    </body>

<script src="game.js"></script> <!-- src means source file, and it only recognizes game.js b/c theyre in the same folder, otherwise you'd need to specify the file path -->
</html> <!-- End the file -->
